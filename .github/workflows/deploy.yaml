name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync --dev --locked

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432; do
            sleep 1
          done

      - name: Run pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/testdb
          TEST_DB_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/testdb
          JWT_KEY: dummy-key-for-testing
          JWT_ALG: HS256
          MAIL_PASSWORD: random-password
          MAIL_USERNAME: randomemail@gmail.com
          MAIL_FROM: randomemail@gmail.com
          MAIL_FROM_NAME: App-name
          GOOGLE_CLIENT_ID: test-google-client-id
          GOOGLE_CLIENT_SECRET: test-google-client-secret
          GOOGLE_REDIRECT_URI: http://localhost:8000/api/v1/auth/google/callback
          REDIS_URL: redis://localhost:6379/0
          CLOUDINARY_CLOUD_NAME: test_cloud_name
          CLOUDINARY_API_KEY: test_api_key
          CLOUDINARY_API_SECRET: test_api_secret
        run: |
          uv run pytest -v

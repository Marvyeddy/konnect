{% extends "layout.html" %}

{% block content %}
  <h1 style="margin: 0 0 16px; color: #0f172a; font-size: 24px; line-height: 1.3;">
    {{ subject }}
  </h1>

  <p style="margin: 0 0 16px 0; font-size: 16px;">
    Please click the button below to reset your password.
  </p>
  <a 
    href="{{ link }}" 
    style="display: inline-block; padding: 12px 24px; background-color: #0f172a; color: #fff; font-size: 16px; border-radius: 6px; text-decoration: none; font-weight: bold;"
    target="_blank"
  >
    Reset Password
  </a>
  <br>
  <p style="font-size: 14px; color: #64748b; margin-top: 10px;">
    If the button above does not work, please copy and paste the following link into your browser:<br>
    <a href="{{ link }}" target="_blank" style="color: #0f172a;">{{ link }}</a>
  </p>
{% endblock %}

[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "fastapi-guard>=7.4.1",
    "fastapi-mail>=1.6.5",
    "fastapi[standard]>=0.141.1",
    "passlib[argon2]>=1.7.4",
    "pyjwt>=2.13.0",
    "sqlmodel>=0.0.39",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.1",
]

[tool.ruff.lint]
# "E" and "F" are standard Python errors. "I" is the isort import sorter.
select = ["E", "F", "I"]

# Automatically fix import sorting rules on check/fix commands
fixable = ["I"]
